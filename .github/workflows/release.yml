name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the "v" prefix (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, package and publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check version and branch
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3"; exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Releases can only be made from master"; exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists"; exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Tests use Quarkus Dev Services (PostgreSQL in Docker), available on ubuntu runners
      - name: Backend tests and package
        working-directory: backend
        run: ./mvnw -B verify

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend format, tests and build
        working-directory: frontend
        run: |
          npm ci
          npx prettier --check .
          npx ng test --watch=false
          npx ng build

      - name: Create artifacts
        run: |
          mkdir -p release
          tar -czf "release/matriz-backend-$VERSION.tar.gz" -C backend/target quarkus-app
          tar -czf "release/matriz-frontend-$VERSION.tar.gz" -C frontend/dist/frontend/browser .

      - name: Image owner in lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/src/main/docker/Dockerfile.jvm
          push: true
          provenance: false
          tags: ghcr.io/${{ env.OWNER }}/matriz-backend:${{ inputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          provenance: false
          tags: ghcr.io/${{ env.OWNER }}/matriz-frontend:${{ inputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Create GitHub release
        run: |
          gh release create "v$VERSION" release/* \
            --target "$GITHUB_SHA" \
            --title "Matriz $VERSION" \
            --generate-notes \
            --notes "Images: \`ghcr.io/$OWNER/matriz-backend:$VERSION\`, \`ghcr.io/$OWNER/matriz-frontend:$VERSION\`"
