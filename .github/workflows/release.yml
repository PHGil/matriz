name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the "v" prefix (e.g. 0.1.0)'
        required: true
        type: string
      run_unit_tests:
        description: 'Run backend and frontend unit/API tests, prettier and ArchUnit'
        type: boolean
        default: true
      run_system_tests:
        description: 'Run the system tests (API against PostgreSQL and Keycloak)'
        type: boolean
        default: true
      run_e2e_tests:
        description: 'Run the end-to-end tests (Playwright)'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stack-tests:
    name: System and E2E tests
    if: ${{ inputs.run_system_tests || inputs.run_e2e_tests }}
    uses: ./.github/workflows/stack-tests.yml
    with:
      system: ${{ inputs.run_system_tests }}
      e2e: ${{ inputs.run_e2e_tests }}

  release:
    name: Test, package and publish
    needs: stack-tests
    # Runs when the stack tests passed or were not requested
    if: ${{ !cancelled() && (needs.stack-tests.result == 'success' || needs.stack-tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check version and branch
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3"; exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Releases can only be made from master"; exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists"; exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Tests use Quarkus Dev Services (PostgreSQL in Docker), available on ubuntu runners
      - name: Backend tests and package
        if: ${{ inputs.run_unit_tests }}
        working-directory: backend
        run: ./mvnw -B verify
      - name: Backend package (tests skipped)
        if: ${{ !inputs.run_unit_tests }}
        working-directory: backend
        run: ./mvnw -B package -DskipTests

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend format and tests
        if: ${{ inputs.run_unit_tests }}
        working-directory: frontend
        run: |
          npx prettier --check .
          npx ng test --watch=false
      - name: Frontend build
        working-directory: frontend
        run: npx ng build

      - name: Create artifacts
        run: |
          mkdir -p release
          tar -czf "release/matriz-backend-$VERSION.tar.gz" -C backend/target quarkus-app
          tar -czf "release/matriz-frontend-$VERSION.tar.gz" -C frontend/dist/frontend/browser .

      - name: Image owner in lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/src/main/docker/Dockerfile.jvm
          push: true
          provenance: false
          tags: ghcr.io/${{ env.OWNER }}/matriz-backend:${{ inputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          provenance: false
          tags: ghcr.io/${{ env.OWNER }}/matriz-frontend:${{ inputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Create GitHub release
        run: |
          gh release create "v$VERSION" release/* \
            --target "$GITHUB_SHA" \
            --title "Matriz $VERSION" \
            --generate-notes \
            --notes "Images: \`ghcr.io/$OWNER/matriz-backend:$VERSION\`, \`ghcr.io/$OWNER/matriz-frontend:$VERSION\`"
