quarkus.rest.path=/api/v1

# Database (Flyway owns the schema). Credentials come from environment variables / backend/.env.
quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.username=${DB_USER}
%dev,prod.quarkus.datasource.password=${DB_PASSWORD}
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:matriz}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.locations=db/migration,db/seed

# Authentication: Keycloak realm "matriz" (ADR-08)
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/matriz
quarkus.oidc.client-id=matriz-backend
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=matriz-backend
quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false

# Keycloak Admin API for the user sync (ADR-09)
quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL:http://localhost:8180}
quarkus.keycloak.admin-client.realm=matriz
quarkus.keycloak.admin-client.client-id=matriz-backend
quarkus.keycloak.admin-client.client-secret=${MATRIZ_BACKEND_CLIENT_SECRET:}
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS
%test.quarkus.keycloak.admin-client.enabled=false
