name: matriz

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm', '--http-port=8180']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
      # Token issuer stays localhost:8180 (browser); the backend container reaches Keycloak as keycloak:8180
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      MATRIZ_BACKEND_CLIENT_SECRET: ${MATRIZ_BACKEND_CLIENT_SECRET}
      MATRIZ_DEMO_PASSWORD: ${MATRIZ_DEMO_PASSWORD}
    ports:
      - '8180:8180'
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; the management port 9000 serves /health/ready
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Full application: docker compose --profile app up -d --build
  backend:
    profiles: [app]
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8180
      MATRIZ_BACKEND_CLIENT_SECRET: ${MATRIZ_BACKEND_CLIENT_SECRET}
      # The database may hold the dev-only seed (R__demo_data), which the packaged app does not ship
      QUARKUS_FLYWAY_IGNORE_MIGRATION_PATTERNS: '*:missing'
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:8080/q/health/ready']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    profiles: [app]
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    # Port 4200 is the redirect URI registered for matriz-frontend in the realm
    ports:
      - '4200:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
