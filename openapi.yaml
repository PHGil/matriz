openapi: 3.1.0
info:
  title: Matriz API
  version: 0.3.0
  description: |
    REST contract for the Matriz MVP (Class 3). See docs/architecture.md,
    docs/database.md and docs/implementation-plan.md (access rules).

    **Authentication lifecycle (ADR-08).** Login, logout and accounts are handled
    by Keycloak (realm `matriz`), not by this API. The Angular app obtains an
    access token with OIDC Authorization Code + PKCE (client `matriz-frontend`)
    and sends it as `Authorization: Bearer <token>`. Access tokens expire after
    5 minutes and are refreshed silently while the Keycloak session is valid
    (idle 30 min, max 8 h). Logout ends the Keycloak session. Any request with a
    missing, invalid or expired token gets `401`.

    **Authorisation.** Non-members of a project receive `404` for the project
    and everything under it, so its existence is not revealed (EC-05). Members
    without the required role receive `403`. Identity (project manager,
    comment author) always comes from the token, never from the request.

    **Validation.** Text fields are trimmed before validation; whitespace-only
    values are rejected. Errors use RFC 9457 `application/problem+json`.

    All traffic must use HTTPS in deployment (NFR-02).
servers:
  - url: http://localhost:8080/api/v1
    description: Local development. Production hosting is pending (D-04).
security:
  - keycloak: []
tags:
  - name: auth
    description: Authenticated user (US-01). Login/logout happen in Keycloak.
  - name: projects
    description: Projects, search, dashboard counts and progress (US-03, US-07, US-14, US-15).
  - name: members
    description: Project membership (US-04).
  - name: users
    description: Directory of active users, used to add members.
  - name: tasks
    description: Tasks and filters (US-05, US-06, US-08, US-09).
  - name: assignees
    description: Task assignees (US-12).
  - name: comments
    description: Task comments (US-13).

paths:
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: Creates or updates the local user record from the token claims on first use (ADR-09).
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List the user's projects with task counts (dashboard)
      description: Only projects where the user is Manager or Member (FR-13). Sorted by name.
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive search on the project name (FR-16).
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project
      description: The authenticated user becomes its Manager (FR-10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      summary: Get a project
      responses:
        '200':
          description: Project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Edit a project (Manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Project updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Delete a project (Manager only)
      description: Deletes members, tasks, assignments and comments with it (FR-15).
      responses:
        '204':
          description: Project deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/progress:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProjectProgress
      summary: Get task counts per status and percentage done
      description: |
        Counts always cover all tasks of the project, regardless of filters.
        `percentDone` = round(100 × done / total); `null` when there are no tasks (EC-06).
      responses:
        '200':
          description: Project progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectProgress'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [members]
      operationId: listMembers
      summary: List project members (also the eligible assignees)
      responses:
        '200':
          description: Members, Manager first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [members]
      operationId: addMember
      summary: Add a member (Manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRef'
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [members]
      operationId: removeMember
      summary: Remove a member (Manager only)
      description: |
        Also removes the member's assignments in this project (EC-02).
        The Manager cannot be removed (EC-04) → 409.
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /users:
    get:
      tags: [users]
      operationId: searchUsers
      summary: Search active users (to add as project members)
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive match on name or email.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Active users, at most 20, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDirectoryEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List tasks, optionally filtered (FR-32)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskPriority'
      responses:
        '200':
          description: Tasks, most recently updated first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [tasks]
      operationId: createTask
      summary: Create a task
      description: Starts as `TODO`; priority defaults to `MEDIUM`; no assignees (FR-20, FR-22, FR-26).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
            example:
              title: Review proposal
      responses:
        '201':
          description: Task created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: Get a task
      responses:
        '200':
          description: Task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: Update a task (fields, status, priority)
      description: |
        Partial update; only the fields sent are changed. `null` clears `description`
        or `dueDate`. Any status transition is allowed (US-06 AC2). Last write wins (EC-01).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
            example:
              status: IN_PROGRESS
      responses:
        '200':
          description: Task updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Delete a task (Manager only)
      description: Assignments and comments are deleted with it.
      responses:
        '204':
          description: Task deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/tasks/{taskId}/assignees:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [assignees]
      operationId: addAssignee
      summary: Assign a user to the task
      description: The user must be an active project member (FR-24). Duplicate → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRef'
      responses:
        '201':
          description: Assignment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /projects/{projectId}/tasks/{taskId}/assignees/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [assignees]
      operationId: removeAssignee
      summary: Remove an assignment
      responses:
        '204':
          description: Assignment removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [comments]
      operationId: listComments
      summary: List comments, oldest first
      responses:
        '200':
          description: Comments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [comments]
      operationId: addComment
      summary: Add a comment
      description: Author and date are set by the server from the access token (FR-27).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    keycloak:
      type: openIdConnect
      description: Keycloak realm `matriz`, client `matriz-frontend` (Authorization Code + PKCE). Send the access token as a Bearer token.
      openIdConnectUrl: http://localhost:8180/realms/matriz/.well-known/openid-configuration

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Invalid input.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Validation failed
            status: 400
            errors:
              - field: title
                message: O título deve ter entre 3 e 150 caracteres.
    Unauthenticated:
      description: Missing, invalid or expired access token (EC-07).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (e.g. Member trying a Manager action).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or the user is not a member of the project (EC-05).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not found
            status: 404
    Conflict:
      description: Request conflicts with current state (duplicate, removing the Manager, etc.).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    CurrentUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
          description: Keycloak user id (`sub`).
        name:
          type: string
        email:
          type: string
          format: email

    UserRef:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid

    UserSummary:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
          description: false is shown as "(desativado)" (EC-03).

    UserDirectoryEntry:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email

    ProjectRole:
      type: string
      enum: [MANAGER, MEMBER]

    StatusCounts:
      type: object
      required: [todo, inProgress, done, total]
      properties:
        todo:
          type: integer
          minimum: 0
        inProgress:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    ProjectCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 1000

    ProjectUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 1000

    Project:
      type: object
      required: [id, name, myRole, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        myRole:
          $ref: '#/components/schemas/ProjectRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectSummary:
      type: object
      required: [id, name, myRole, counts]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        myRole:
          $ref: '#/components/schemas/ProjectRole'
        counts:
          $ref: '#/components/schemas/StatusCounts'

    ProjectProgress:
      type: object
      required: [projectId, total, todo, inProgress, done, percentDone]
      properties:
        projectId:
          type: string
          format: uuid
        total:
          type: integer
          minimum: 0
        todo:
          type: integer
          minimum: 0
        inProgress:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        percentDone:
          type: [integer, 'null']
          minimum: 0
          maximum: 100

    Member:
      type: object
      required: [user, role, addedAt]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        role:
          $ref: '#/components/schemas/ProjectRole'
        addedAt:
          type: string
          format: date-time

    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]

    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    TaskCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          description: Stored as plain text (EC-08).
        description:
          type: [string, 'null']
          maxLength: 2000
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: [string, 'null']
          format: date
          description: Past dates are accepted (EC-09).

    TaskUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: [string, 'null']
          format: date

    Task:
      type: object
      required:
        [
          id,
          projectId,
          title,
          status,
          priority,
          assignees,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: [string, 'null']
          format: date
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CommentCreate:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000

    Comment:
      type: object
      required: [id, taskId, author, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserSummary'
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
