<header class="topbar">
  <a class="brand" routerLink="/">{{ title }}</a>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      >Início</a
    >
    <a routerLink="/projetos" routerLinkActive="active">Projetos</a>
  </nav>
  <span class="spacer"></span>
  @if (auth.user(); as user) {
    <span class="user">{{ user.name }}</span>
  }
  <button type="button" (click)="auth.logout()">Sair</button>
</header>
@if (auth.sessionExpired()) {
  <div class="banner" role="alert">
    A sua sessão expirou. Inicie sessão novamente para continuar.
    <button type="button" (click)="auth.login()">Iniciar sessão</button>
  </div>
}
<main>
  <router-outlet />
</main>
